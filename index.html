<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c9b8e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>DreamGarden</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1c1526;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #c9b8e8 0%, #e7cfe4 55%, #ffe0cc 100%);
        color: #5b4636;
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.18em;
        font-size: 13px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot">DreamGarden</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
