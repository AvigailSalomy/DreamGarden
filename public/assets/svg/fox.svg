<svg xmlns="http://www.w3.org/2000/svg" width="220" height="190" viewBox="0 0 220 190">
  <defs>
    <linearGradient id="foxBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3a25c"/>
      <stop offset="1" stop-color="#dd7e3a"/>
    </linearGradient>
  </defs>
  <ellipse cx="110" cy="176" rx="62" ry="10" fill="#46323c" opacity="0.16"/>

  <!-- tail, tip white -->
  <path d="M170,130 C 202,120 210,90 192,66 C 180,52 158,54 152,72 C 168,78 176,96 168,112 C 162,124 156,130 148,134 Z"
