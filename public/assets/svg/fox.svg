  <circle cx="24" cy="86" r="5" fill="#2b1e17"/>
  <circle cx="70" cy="58" r="6" fill="#2b1e17"/>
  <circle cx="68" cy="56" r="1.8" fill="#fffdf5"/>
  <circle cx="98" cy="60" r="6" fill="#2b1e17"/>
  <circle cx="96" cy="58" r="1.8" fill="#fffdf5"/>
