  <path d="M192,66 C 202,78 200,96 184,104 C 176,90 178,76 188,66 Z" fill="#fbf3e6"/>

  <!-- back haunch + body -->
  <path d="M64,168 C 40,150 36,112 62,90 C 88,70 132,70 156,92 C 178,112 174,150 150,168
           C 128,182 86,182 64,168 Z" fill="url(#foxBody)" stroke="#b8632a" stroke-width="3"/>
  <!-- chest / belly -->
  <path d="M78,168 C 70,148 74,120 96,110 C 112,104 126,110 132,124 C 138,144 130,164 112,172
           C 100,176 86,174 78,168 Z" fill="#fbf3e6"/>

  <!-- legs -->
  <ellipse cx="82" cy="176" rx="12" ry="9" fill="#3f2c22"/>
  <ellipse cx="140" cy="176" rx="12" ry="9" fill="#3f2c22"/>

  <!-- head -->
  <circle cx="86" cy="70" r="46" fill="url(#foxBody)" stroke="#b8632a" stroke-width="3"/>
  <path d="M60,66 C 52,56 56,44 68,42 C 78,44 76,58 72,68 Z" fill="#fbf3e6"/>

  <!-- ears -->
  <path d="M50,44 C 40,16 54,-4 72,6 C 82,12 78,34 66,48 Z" fill="url(#foxBody)" stroke="#b8632a" stroke-width="3"/>
  <path d="M56,38 C 52,22 58,10 68,14 C 74,18 70,32 62,40 Z" fill="#3f2c22"/>
  <path d="M104,40 C 108,12 96,-6 80,6 C 72,12 78,32 90,46 Z" fill="url(#foxBody)" stroke="#b8632a" stroke-width="3"/>
  <path d="M98,34 C 100,18 94,8 84,14 C 80,18 84,30 92,38 Z" fill="#3f2c22"/>

  <!-- face: forward-facing muzzle so the "look direction" reads clearly -->
