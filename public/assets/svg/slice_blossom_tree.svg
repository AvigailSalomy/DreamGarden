<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440">
  <defs>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a97d53"/><stop offset="0.5" stop-color="#8f6444"/><stop offset="1" stop-color="#6e4c33"/>
    </linearGradient>
    <radialGradient id="pinkBack" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#f3b8d6"/><stop offset="1" stop-color="#d888ae"/></radialGradient>
    <radialGradient id="pinkMid" cx="0.4" cy="0.28" r="0.8"><stop offset="0" stop-color="#f9cfe2"/><stop offset="1" stop-color="#e79cc0"/></radialGradient>
    <radialGradient id="pinkFront" cx="0.35" cy="0.25" r="0.8"><stop offset="0" stop-color="#fff0f6"/><stop offset="1" stop-color="#f7b8d4"/></radialGradient>
    <filter id="tsoft"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="tshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#3a2a1e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="180" cy="424" rx="130" ry="16" fill="#2e2116" opacity="0.22"/>

  <!-- trunk -->
  <path d="M164,420 C158,340 150,280 168,220 C176,196 182,176 176,150
           C186,176 196,198 190,222 C206,282 202,344 196,420 Z" fill="url(#bark)" stroke="#5c4029" stroke-width="3"/>
  <path d="M168,300 q-14,-10 -8,-34" stroke="#5c4029" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M190,260 q16,-8 14,-30" stroke="#5c4029" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- canopy: back (blurred, darker) -> mid -> front highlight, all warm-lit from upper-left -->
  <g filter="url(#tsoft)">
    <ellipse cx="120" cy="130" rx="88" ry="70" fill="url(#pinkBack)"/>
    <ellipse cx="230" cy="120" rx="92" ry="74" fill="url(#pinkBack)"/>
    <ellipse cx="180" cy="80" rx="86" ry="62" fill="url(#pinkBack)"/>
  </g>
  <g filter="url(#tshadow)">
    <ellipse cx="130" cy="140" rx="86" ry="66" fill="url(#pinkMid)"/>
    <ellipse cx="222" cy="132" rx="88" ry="68" fill="url(#pinkMid)"/>
    <ellipse cx="176" cy="92" rx="82" ry="58" fill="url(#pinkMid)"/>
  </g>
  <ellipse cx="120" cy="118" rx="58" ry="42" fill="url(#pinkFront)" opacity="0.92"/>
  <ellipse cx="204" cy="106" rx="52" ry="38" fill="url(#pinkFront)" opacity="0.88"/>
  <ellipse cx="164" cy="76" rx="46" ry="32" fill="url(#pinkFront)" opacity="0.85"/>

  <!-- individual blossom dot clusters for texture -->
  <g fill="#fffdf5" opacity="0.9">
    <circle cx="98" cy="108" r="4"/><circle cx="150" cy="92" r="3.4"/><circle cx="188" cy="70" r="3.8"/>
    <circle cx="226" cy="98" r="4"/><circle cx="252" cy="128" r="3.4"/><circle cx="70" cy="140" r="3.6"/>
    <circle cx="120" cy="150" r="3"/><circle cx="200" cy="150" r="3.4"/>
  </g>

  <!-- a couple of baked-in falling petals near the canopy edge -->
  <g fill="#f7b8d4">
    <ellipse cx="60" cy="176" rx="7" ry="5" transform="rotate(30 60 176)"/>
    <ellipse cx="266" cy="188" rx="7" ry="5" transform="rotate(-20 266 188)"/>
  </g>
</svg>
