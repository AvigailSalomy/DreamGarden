<svg xmlns="http://www.w3.org/2000/svg" width="380" height="320" viewBox="0 0 380 320">
  <defs>
    <radialGradient id="leafFar" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#5c9a4e"/><stop offset="1" stop-color="#345c2d"/></radialGradient>
    <radialGradient id="petalFg" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff0f6"/><stop offset="1" stop-color="#f3a9cf"/></radialGradient>
    <filter id="fgblur"><feGaussianBlur stdDeviation="4.5"/></filter>
  </defs>

  <!-- soft out-of-focus leaves, deliberately blurred: reads as "very close to camera" -->
  <g filter="url(#fgblur)">
    <ellipse cx="60" cy="260" rx="110" ry="70" fill="url(#leafFar)"/>
    <ellipse cx="0" cy="150" rx="90" ry="130" fill="url(#leafFar)"/>
    <ellipse cx="200" cy="300" rx="90" ry="50" fill="url(#leafFar)"/>
  </g>

  <!-- one in-focus flower cluster in the near-corner for contrast against the blur -->
  <g transform="translate(120,230)">
    <path d="M0,60 C-6,30 -2,10 6,-10" stroke="#4f8a44" stroke-width="8" fill="none" stroke-linecap="round"/>
    <g>
      <circle r="16" fill="url(#petalFg)"/>
      <circle cx="20" cy="4" r="14" fill="url(#petalFg)"/>
      <circle cx="10" cy="-18" r="14" fill="url(#petalFg)"/>
      <circle cx="-4" cy="6" r="6" fill="#ffe6a3"/>
    </g>
  </g>
  <g transform="translate(70,60)">
    <path d="M0,60 C4,30 0,10 -8,-8" stroke="#4f8a44" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g>
      <circle r="13" fill="#b98be0"/><circle cx="16" cy="4" r="11" fill="#b98be0"/>
      <circle cx="-2" cy="4" r="5" fill="#ffe6a3"/>
    </g>
  </g>
</svg>
