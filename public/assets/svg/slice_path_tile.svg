<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260">
  <defs>
    <linearGradient id="stoneA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cda3"/><stop offset="1" stop-color="#c7a274"/>
    </linearGradient>
    <linearGradient id="stoneB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcc196"/><stop offset="1" stop-color="#b6906a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3a2a1e" flood-opacity="0.28"/>
    </filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- soft ground shadow under the whole path -->
  <ellipse cx="210" cy="220" rx="190" ry="34" fill="#2e2116" opacity="0.22" filter="url(#blur2)"/>

  <!-- grass edging with tiny blossoms, both sides -->
  <g>
    <path d="M14,150 C40,120 30,90 54,70" stroke="#4f8a44" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M30,160 C50,138 44,112 62,96" stroke="#5c9a4e" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M380,140 C356,112 366,86 344,64" stroke="#4f8a44" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M366,158 C346,132 352,108 336,88" stroke="#5c9a4e" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="56" cy="66" r="7" fill="#f3a9cf"/><circle cx="340" cy="60" r="6" fill="#ffe6a3"/>
    <circle cx="20" cy="110" r="5" fill="#fef1f4"/><circle cx="394" cy="120" r="5" fill="#b98be0"/>
  </g>

  <!-- individual stones, warm gradient + soft shadow, irregular silhouettes -->
  <g filter="url(#soft)">
    <path d="M60,210 Q40,180 70,160 Q110,140 150,158 Q170,180 150,205 Q105,228 60,210Z" fill="url(#stoneA)" stroke="#9c7850" stroke-width="3"/>
    <path d="M150,196 Q140,168 175,150 Q212,134 244,152 Q260,176 240,198 Q195,216 150,196Z" fill="url(#stoneB)" stroke="#8f6a45" stroke-width="3"/>
    <path d="M238,190 Q232,160 268,144 Q305,130 336,150 Q350,172 330,192 Q285,210 238,190Z" fill="url(#stoneA)" stroke="#9c7850" stroke-width="3"/>
    <path d="M100,150 Q94,124 126,112 Q158,102 182,120 Q192,140 172,154 Q132,166 100,150Z" fill="url(#stoneB)" stroke="#8f6a45" stroke-width="3"/>
  </g>

  <!-- individual pebbles for grain -->
  <g fill="#f2e0bd" opacity="0.85">
    <circle cx="90" cy="188" r="4"/><circle cx="180" cy="172" r="3.4"/><circle cx="270" cy="162" r="4"/>
    <circle cx="130" cy="200" r="3"/><circle cx="220" cy="184" r="3.6"/>
  </g>
  <!-- crack/seam lines between stones for readability -->
  <g stroke="#7a5c3c" stroke-width="2.2" opacity="0.55" fill="none">
    <path d="M150,158 Q150,178 150,205"/>
    <path d="M240,152 Q240,172 240,198"/>
  </g>
</svg>
