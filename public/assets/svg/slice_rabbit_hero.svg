<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260">
  <defs>
    <linearGradient id="furBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f2dfc4"/>
    </linearGradient>
    <linearGradient id="furBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef8"/><stop offset="1" stop-color="#fbeed8"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb3b8" stop-opacity="0.75"/><stop offset="1" stop-color="#ffb3b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="rshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4a3428" flood-opacity="0.3"/>
    </filter>
  </defs>

  <ellipse cx="120" cy="248" rx="66" ry="12" fill="#2e2116" opacity="0.22"/>

  <g filter="url(#rshadow)">
    <!-- ears, rim-lit on the upper-left edge -->
    <path d="M84,86 C68,32 82,-4 104,4 C120,10 116,52 104,92 Z" fill="url(#furBody)" stroke="#d9c19a" stroke-width="3"/>
    <path d="M90,80 C78,40 88,10 102,16 C112,22 108,52 100,84 Z" fill="#f3c9cf"/>
    <path d="M156,86 C172,32 158,-4 136,4 C120,10 124,52 136,92 Z" fill="url(#furBody)" stroke="#d9c19a" stroke-width="3"/>
    <path d="M150,80 C160,42 152,12 138,18 C128,24 132,54 140,84 Z" fill="#f3c9cf"/>
    <path d="M86,10 C82,26 84,50 92,70" stroke="#fffdf5" stroke-width="3" fill="none" opacity="0.7"/>

    <!-- body, two-tone volume -->
    <path d="M64,196 C40,150 46,96 96,74 C128,60 168,72 184,104
             C204,140 196,186 158,206 C130,220 84,218 64,196 Z" fill="url(#furBody)" stroke="#d9c19a" stroke-width="3"/>
    <path d="M78,200 C64,176 66,142 88,124 C104,112 124,116 130,132
             C138,154 128,182 104,196 C94,202 84,200 78,200 Z" fill="url(#furBelly)"/>

    <!-- front paws -->
    <ellipse cx="94" cy="208" rx="22" ry="15" fill="url(#furBelly)" stroke="#d9c19a" stroke-width="3"/>
    <ellipse cx="140" cy="210" rx="22" ry="15" fill="url(#furBelly)" stroke="#d9c19a" stroke-width="3"/>

    <!-- head -->
    <circle cx="118" cy="112" r="52" fill="url(#furBody)" stroke="#d9c19a" stroke-width="3"/>
    <path d="M84,100 C80,120 86,140 104,150" stroke="#fffdf5" stroke-width="4" fill="none" opacity="0.5"/>
  </g>

  <!-- blush -->
  <ellipse cx="86" cy="128" rx="16" ry="10" fill="url(#blush)"/>
  <ellipse cx="150" cy="128" rx="16" ry="10" fill="url(#blush)"/>

  <!-- face -->
  <circle cx="100" cy="110" r="8.5" fill="#5b4636"/><circle cx="97" cy="106" r="2.8" fill="#fffdf5"/>
  <circle cx="138" cy="110" r="8.5" fill="#5b4636"/><circle cx="135" cy="106" r="2.8" fill="#fffdf5"/>
  <ellipse cx="119" cy="130" rx="7" ry="5" fill="#d98f97"/>
  <path d="M119,135 C119,144 108,148 100,144 M119,135 C119,144 130,148 138,144"
        stroke="#c98a8f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g stroke="#e7d6bd" stroke-width="2.4" stroke-linecap="round">
    <path d="M96,132 C76,132 60,126 46,116"/>
    <path d="M96,138 C76,140 58,146 42,152"/>
    <path d="M142,132 C162,132 178,126 192,116"/>
    <path d="M142,138 C162,140 180,146 196,152"/>
  </g>
</svg>
