<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="wpw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b085"/>
      <stop offset="1" stop-color="#a97d53"/>
    </linearGradient>
    <linearGradient id="wsoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5d40"/>
      <stop offset="1" stop-color="#5c4531"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="292" rx="120" ry="12" fill="#46323c" opacity="0.16"/>

  <!-- REAR blooms: drawn first, so the planter rim overlaps their stem bases.
       Stems are SHORT and start in the soil; heads sit just above the rim. -->
  <g stroke="#7fae7c" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M96,150 C 90,120 86,96 92,74"/>
    <path d="M150,152 C 148,118 148,92 150,66"/>
    <path d="M206,150 C 212,120 214,98 206,80"/>
    <path d="M124,150 C 121,128 121,112 124,100"/>
    <path d="M178,150 C 181,128 181,112 178,100"/>
  </g>
  <g stroke-width="2.5">
    <g transform="translate(92,66)" fill="#b98be0" stroke="#a06fd0">
      <ellipse cx="0" cy="-12" rx="8" ry="12"/><ellipse cx="12" cy="0" rx="8" ry="12" transform="rotate(72 12 0)"/>
      <ellipse cx="7" cy="12" rx="8" ry="12" transform="rotate(144 7 12)"/><ellipse cx="-7" cy="12" rx="8" ry="12" transform="rotate(216 -7 12)"/>
      <ellipse cx="-12" cy="0" rx="8" ry="12" transform="rotate(288 -12 0)"/>
      <circle cx="0" cy="0" r="5" fill="#ffe6a3" stroke="none"/></g>
    <g transform="translate(150,58)" fill="#f3a9cf" stroke="#e58bb9">
      <ellipse cx="0" cy="-13" rx="9" ry="14"/><ellipse cx="13" cy="0" rx="9" ry="14" transform="rotate(72 13 0)"/>
      <ellipse cx="8" cy="13" rx="9" ry="14" transform="rotate(144 8 13)"/><ellipse cx="-8" cy="13" rx="9" ry="14" transform="rotate(216 -8 13)"/>
      <ellipse cx="-13" cy="0" rx="9" ry="14" transform="rotate(288 -13 0)"/>
      <circle cx="0" cy="0" r="6" fill="#f5c24b" stroke="none"/></g>
    <g transform="translate(206,72)" fill="#f5c24b" stroke="#e0a832">
      <ellipse cx="0" cy="-11" rx="7" ry="11"/><ellipse cx="11" cy="0" rx="7" ry="11" transform="rotate(72 11 0)"/>
      <ellipse cx="7" cy="11" rx="7" ry="11" transform="rotate(144 7 11)"/><ellipse cx="-7" cy="11" rx="7" ry="11" transform="rotate(216 -7 11)"/>
      <ellipse cx="-11" cy="0" rx="7" ry="11" transform="rotate(288 -11 0)"/>
      <circle cx="0" cy="0" r="5" fill="#8f6444" stroke="none"/></g>
    <circle cx="124" cy="96" r="7" fill="#f3a9cf" stroke="#e58bb9"/>
    <circle cx="178" cy="96" r="7" fill="#b98be0" stroke="#a06fd0"/>
  </g>

  <!-- the planter: wide wooden trough, the visual anchor of the bed -->
  <path d="M26,132 L274,132 L248,286 C 248,292 218,296 150,296 C 82,296 52,292 52,286 Z"
        fill="url(#wpw)" stroke="#8f6444" stroke-width="4"/>
  <rect x="18" y="112" width="264" height="26" rx="11" fill="#e2bd93" stroke="#8f6444" stroke-width="4"/>
  <path d="M34,140 C 90,126 210,126 266,140 C 250,158 206,164 150,164 C 94,164 50,158 34,140 Z" fill="url(#wsoil)"/>
  <path d="M56,138 q46,-8 94,0" stroke="#8f6a48" stroke-width="3" fill="none" opacity="0.55"/>

  <!-- FRONT blooms: rooted in the soil, standing just in front of the rim -->
  <g stroke="#7bb268" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M108,150 C 104,130 104,120 108,104"/>
    <path d="M150,152 C 150,132 150,120 150,102"/>
    <path d="M192,150 C 196,130 196,120 192,106"/>
  </g>
  <g stroke-width="2.5">
    <g transform="translate(108,100)" fill="#f3a9cf" stroke="#e58bb9">
      <ellipse cx="0" cy="-12" rx="9" ry="13"/><ellipse cx="12" cy="0" rx="9" ry="13" transform="rotate(72 12 0)"/>
      <ellipse cx="7" cy="12" rx="9" ry="13" transform="rotate(144 7 12)"/><ellipse cx="-7" cy="12" rx="9" ry="13" transform="rotate(216 -7 12)"/>
      <ellipse cx="-12" cy="0" rx="9" ry="13" transform="rotate(288 -12 0)"/>
      <circle cx="0" cy="0" r="6" fill="#f5c24b" stroke="none"/></g>
    <g transform="translate(150,96)" fill="#f5c24b" stroke="#e0a832">
      <ellipse cx="0" cy="-13" rx="10" ry="14"/><ellipse cx="13" cy="0" rx="10" ry="14" transform="rotate(72 13 0)"/>
      <ellipse cx="8" cy="13" rx="10" ry="14" transform="rotate(144 8 13)"/><ellipse cx="-8" cy="13" rx="10" ry="14" transform="rotate(216 -8 13)"/>
      <ellipse cx="-13" cy="0" rx="10" ry="14" transform="rotate(288 -13 0)"/>
      <circle cx="0" cy="0" r="6" fill="#c9902f" stroke="none"/></g>
    <g transform="translate(192,102)" fill="#b98be0" stroke="#a06fd0">
      <ellipse cx="0" cy="-12" rx="9" ry="13"/><ellipse cx="12" cy="0" rx="9" ry="13" transform="rotate(72 12 0)"/>
      <ellipse cx="7" cy="12" rx="9" ry="13" transform="rotate(144 7 12)"/><ellipse cx="-7" cy="12" rx="9" ry="13" transform="rotate(216 -7 12)"/>
      <ellipse cx="-12" cy="0" rx="9" ry="13" transform="rotate(288 -12 0)"/>
      <circle cx="0" cy="0" r="6" fill="#ffe6a3" stroke="none"/></g>
  </g>

  <!-- soil sprigs + a sparkle -->
  <path d="M78,150 q-6,-13 2,-22 q8,9 4,22z" fill="#8fc77a"/>
  <path d="M224,150 q6,-13 -2,-22 q-8,9 -4,22z" fill="#8fc77a"/>
  <path d="M150,120 l4,8 8,4 -8,4 -4,8 -4,-8 -8,-4 8,-4z" fill="#fffdf5"/>
</svg>
