      <ellipse cx="0" cy="-12" rx="8" ry="13"/><ellipse cx="12" cy="0" rx="8" ry="13" transform="rotate(72 12 0)"/>
      <ellipse cx="7" cy="13" rx="8" ry="13" transform="rotate(144 7 13)"/><ellipse cx="-7" cy="13" rx="8" ry="13" transform="rotate(216 -7 13)"/>
      <ellipse cx="-12" cy="0" rx="8" ry="13" transform="rotate(288 -12 0)"/></g><circle cx="0" cy="0" r="6" fill="#ffe6a3"/></g>

    <g transform="translate(176,78)"><g fill="#f3a9cf" stroke="#e58bb9" stroke-width="2">
      <ellipse cx="0" cy="-10" rx="7" ry="11"/><ellipse cx="10" cy="0" rx="7" ry="11" transform="rotate(72 10 0)"/>
      <ellipse cx="6" cy="11" rx="7" ry="11" transform="rotate(144 6 11)"/><ellipse cx="-6" cy="11" rx="7" ry="11" transform="rotate(216 -6 11)"/>
