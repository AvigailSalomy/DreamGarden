<svg xmlns="http://www.w3.org/2000/svg" width="280" height="240" viewBox="0 0 280 240">
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f5a41"/>
      <stop offset="1" stop-color="#5b4634"/>
    </linearGradient>
  </defs>
  <ellipse cx="140" cy="228" rx="120" ry="14" fill="#46323c" opacity="0.16"/>

  <!-- rich dark soil mound -->
  <path d="M28,206 C 40,168 96,150 140,150 C 184,150 240,166 252,206 C 240,224 190,232 140,232 C 90,232 40,224 28,206 Z"
        fill="url(#soil)" stroke="#4c3a2b" stroke-width="3"/>
  <path d="M40,200 C 70,182 210,182 240,200 C 210,192 70,192 40,200 Z" fill="#7c6749" opacity="0.6"/>

  <!-- leafy base -->
  <g fill="#8fc77a" stroke="#7bb268" stroke-width="2.5">
    <ellipse cx="70" cy="196" rx="20" ry="9" transform="rotate(-16 70 196)"/>
    <ellipse cx="210" cy="196" rx="20" ry="9" transform="rotate(14 210 196)"/>
    <ellipse cx="140" cy="204" rx="24" ry="10"/>
  </g>

  <!-- flower stems -->
  <g stroke="#7fae7c" stroke-width="5" stroke-linecap="round" fill="none">
