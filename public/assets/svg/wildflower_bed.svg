      <ellipse cx="7" cy="12" rx="8" ry="12" transform="rotate(144 7 12)"/><ellipse cx="-7" cy="12" rx="8" ry="12" transform="rotate(216 -7 12)"/>
      <ellipse cx="-11" cy="0" rx="8" ry="12" transform="rotate(288 -11 0)"/></g><circle cx="0" cy="0" r="6" fill="#f5c24b"/></g>

    <g transform="translate(106,74)"><g fill="#f5c24b" stroke="#e0a832" stroke-width="2">
      <ellipse cx="0" cy="-10" rx="7" ry="11"/><ellipse cx="10" cy="0" rx="7" ry="11" transform="rotate(72 10 0)"/>
      <ellipse cx="6" cy="11" rx="7" ry="11" transform="rotate(144 6 11)"/><ellipse cx="-6" cy="11" rx="7" ry="11" transform="rotate(216 -6 11)"/>
      <ellipse cx="-10" cy="0" rx="7" ry="11" transform="rotate(288 -10 0)"/></g><circle cx="0" cy="0" r="5" fill="#8f6444"/></g>

